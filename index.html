<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee Yu Rim - Portfolio</title>
    <style>
        :root {
            --accent-color: #bbe1de;
            --border-color: #eee;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .center { text-align: center; }
        .header-img, .footer-img { width: 100%; display: block; }
        
        /* 프로젝트 박스 디자인 */
        .project-section {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        /* 반응형 이미지 설정 */
        img { max-width: 100%; height: auto; }
        .project-img { border-radius: 8px; margin: 20px 0; }
        
        h2 { border-bottom: 2px solid var(--accent-color); display: inline-block; padding-bottom: 5px; }
        h3 { color: #222; }
        .badge-group { margin: 10px 0; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
        .stack-group h4 { margin-bottom: 10px; color: #666; }
        blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: 15px;
            margin: 15px 0;
            color: #555;
            font-weight: 500;
        }
        ul { padding-left: 20px; }
        .role-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #333;
        }
    </style>
</head>
